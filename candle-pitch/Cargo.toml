[package]
name = "candle-pitch"
description = "Unified CLI for pitch detection models built on the candle framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["audio", "pitch-detection", "candle", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[features]
metal = ["candle-crepe/metal", "candle-swift-f0/metal", "candle-core/metal"]
cuda = ["candle-crepe/cuda", "candle-swift-f0/cuda", "candle-core/cuda"]

[dependencies]
candle-core = "0.10.2"
candle-crepe = { version = "0.1.0", path = "../candle-crepe" }
candle-swift-f0 = { version = "0.1.0", path = "../candle-swift-f0" }
clap = { version = "4.6.1", features = ["derive"] }
kuva = { version = "0.1.6", features = ["png"] }
rubato = "2.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
symphonia = { version = "0.5.5", features = ["mp3", "aac", "isomp4"] }

[lints]
workspace = true
