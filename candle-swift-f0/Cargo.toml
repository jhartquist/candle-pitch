[package]
name = "candle-swift-f0"
description = "SwiftF0 pitch detection model for the candle ML framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/candle-swift-f0"
readme = "README.md"
keywords = ["audio", "pitch-detection", "candle", "ml", "dsp"]
categories = ["multimedia::audio", "science"]
exclude = ["scripts/", "tests/fixtures/"]

[features]
default = ["hf-hub"]
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
hf-hub = ["dep:hf-hub"]

[dependencies]
candle-core = "0.10.2"
candle-nn = "0.10.2"
hf-hub = { version = "0.5.0", optional = true }
realfft = "3.5"

[lints]
workspace = true
